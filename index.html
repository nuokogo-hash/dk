<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>16-бит Охранник клуба</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
            touch-action: manipulation;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 9 / 16;
            background: #000;
            overflow: hidden;
            border: 3px solid #333;
            box-shadow: 0 0 40px rgba(255,255,255,0.05);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            background: #000;
            touch-action: none;
        }

        .touch-btn {
            position: absolute;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #fff;
            background: rgba(0,0,0,0.85);
            border: 3px solid #444;
            padding: 6px 10px;
            cursor: pointer;
            touch-action: manipulation;
            text-shadow: 1px 1px 0 #000;
            box-shadow: 0 4px 0 #222;
            transition: 0.05s linear;
            border-radius: 0;
            letter-spacing: 0.5px;
            z-index: 10;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
            backdrop-filter: blur(2px);
        }

        .touch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #222;
        }

        .touch-btn.left {
            left: 8px;
            bottom: 70px;
            width: calc(50% - 16px);
            border-color: #555;
            font-size: 9px;
        }

        .touch-btn.right {
            right: 8px;
            bottom: 70px;
            width: calc(50% - 16px);
            border-color: #555;
            font-size: 9px;
        }

        .touch-btn.check-passport {
            left: 50%;
            transform: translateX(-50%);
            bottom: 130px;
            width: 70%;
            border-color: #666;
            font-size: 9px;
            min-height: 36px;
        }

        .touch-btn.breath-test {
            left: 50%;
            transform: translateX(-50%);
            bottom: 175px;
            width: 70%;
            border-color: #8866aa;
            font-size: 9px;
            min-height: 36px;
            background: rgba(40,20,60,0.85);
        }

        .touch-btn.search-btn {
            left: 50%;
            transform: translateX(-50%);
            bottom: 220px;
            width: 70%;
            border-color: #aa8844;
            font-size: 9px;
            min-height: 36px;
            background: rgba(60,40,10,0.85);
        }

        .touch-btn.payment-btn {
            left: 50%;
            transform: translateX(-50%);
            bottom: 265px;
            width: 70%;
            border-color: #44aa88;
            font-size: 9px;
            min-height: 36px;
            background: rgba(10,60,50,0.85);
        }

        .touch-btn.breath-test:active,
        .touch-btn.search-btn:active,
        .touch-btn.payment-btn:active {
            transform: translateX(-50%) translateY(3px);
        }

        .touch-btn.start-shift {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            padding: 18px;
            font-size: 16px;
            border-color: #666;
            z-index: 20;
            background: rgba(0,0,0,0.9);
        }

        .touch-btn.start-shift:active {
            transform: translate(-50%, -50%) translateY(3px);
        }

        .touch-btn.hidden {
            display: none !important;
        }

        #nameModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 30;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 30px;
            flex-direction: column;
        }

        #nameModal.active {
            display: flex;
        }

        .name-content {
            background: #0a0a0a;
            border: 4px solid #444;
            padding: 30px 25px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        .name-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .name-input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 3px solid #444;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .name-input:focus {
            border-color: #666;
        }

        .name-btn {
            padding: 12px 30px;
            background: #111;
            border: 3px solid #555;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            touch-action: manipulation;
            width: 100%;
        }

        .name-btn:active {
            background: #222;
        }

        #storyModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 30;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 30px;
            flex-direction: column;
        }

        #storyModal.active {
            display: flex;
        }

        .story-content {
            background: #0a0a0a;
            border: 4px solid #444;
            padding: 30px 25px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        .story-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #ffcc00;
            margin-bottom: 15px;
            letter-spacing: 2px;
            line-height: 1.6;
        }

        .story-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #aaa;
            padding: 15px;
            border: 2px solid #333;
            margin-bottom: 20px;
            line-height: 1.8;
            text-align: left;
        }

        .story-btn {
            padding: 12px 30px;
            background: #111;
            border: 3px solid #555;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            cursor: pointer;
            touch-action: manipulation;
            width: 100%;
        }

        .story-btn:active {
            background: #222;
        }

        #conditionModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 30;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 30px;
            flex-direction: column;
        }

        #conditionModal.active {
            display: flex;
        }

        .condition-content {
            background: #0a0a0a;
            border: 4px solid #444;
            padding: 30px 25px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        .condition-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #ffcc00;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .condition-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #aaa;
            padding: 15px;
            border: 2px solid #333;
            margin-bottom: 20px;
            line-height: 1.8;
            text-align: left;
        }

        .condition-text .highlight {
            color: #ffcc00;
        }

        .condition-text .tooltip {
            color: #888;
            font-size: 9px;
        }

        .condition-btn {
            padding: 12px 30px;
            background: #111;
            border: 3px solid #555;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            cursor: pointer;
            touch-action: manipulation;
            width: 100%;
        }

        .condition-btn:active {
            background: #222;
        }

        #passportModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #passportModal.active {
            display: flex;
        }

        .passport-content {
            background: #0a0a0a;
            border: 4px solid #444;
            padding: 25px 20px 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        .passport-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #888;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .passport-field {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #888;
            margin: 8px 0;
            text-align: left;
            padding-left: 8px;
            border-left: 2px solid #333;
        }

        .passport-field span {
            color: #fff;
            font-size: 11px;
        }

        .passport-close {
            margin-top: 16px;
            padding: 10px 20px;
            background: #111;
            border: 3px solid #555;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            touch-action: manipulation;
            width: 100%;
        }

        .passport-close:active {
            background: #222;
        }

        #resultPopup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            color: #fff;
            z-index: 6;
            background: rgba(0,0,0,0.95);
            padding: 20px 30px;
            border: 3px solid #666;
            text-align: center;
            display: none;
            pointer-events: none;
            animation: fadeInOut 1.8s ease-in-out;
        }

        #resultPopup.danger {
            color: #ff4444;
            border-color: #ff4444;
        }

        #resultPopup.success {
            color: #44ff44;
            border-color: #44ff44;
        }

        #resultPopup.info {
            color: #44aaff;
            border-color: #44aaff;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }

        #waveCondition {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #888;
            background: rgba(0,0,0,0.85);
            padding: 5px 10px;
            border: 2px solid #333;
            z-index: 5;
            text-align: center;
            width: 92%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(2px);
        }

        #statusBar {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #555;
            background: rgba(0,0,0,0.8);
            padding: 3px 10px;
            border: 2px solid #222;
            z-index: 5;
            text-align: center;
            width: 92%;
        }

        #topPanel {
            position: absolute;
            top: 45px;
            left: 6px;
            right: 6px;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            z-index: 5;
        }

        .panel-item {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #aaa;
            background: rgba(0,0,0,0.7);
            padding: 4px 6px;
            border: 2px solid #222;
            backdrop-filter: blur(2px);
            text-align: center;
            flex: 1;
            min-width: 0;
            line-height: 1.3;
        }

        .panel-item .value {
            display: block;
            font-size: 12px;
            margin-top: 1px;
        }

        .panel-item.timer {
            border-color: #0f0;
        }

        .panel-item.timer.warning {
            border-color: #ff0;
            color: #ff0;
        }

        .panel-item.timer.danger {
            border-color: #f00;
            color: #f00;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .guest-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 180px;
            height: 516px;
            display: none;
            align-items: center;
            justify-content: center;
            margin-top: -20px;
            border-radius: 4px;
            overflow: hidden;
            background: transparent;
        }

        .guest-display img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.03));
        }

        @media (max-width: 400px) {
            .touch-btn { font-size: 8px; padding: 4px 6px; min-height: 30px; }
            .touch-btn.left, .touch-btn.right { font-size: 8px; min-height: 32px; }
            .touch-btn.start-shift { font-size: 12px; padding: 14px; }
            .condition-text { font-size: 9px; }
            .story-text { font-size: 9px; }
            .passport-field { font-size: 8px; }
            .passport-field span { font-size: 9px; }
            #waveCondition { font-size: 7px; }
            .panel-item { font-size: 7px; padding: 3px 4px; }
            .panel-item .value { font-size: 10px; }
            .guest-display { width: 130px; height: 373px; }
            
            .touch-btn.check-passport {
                bottom: 115px;
                width: 65%;
                font-size: 8px;
                min-height: 28px;
                padding: 4px 6px;
            }
            
            .touch-btn.breath-test {
                bottom: 155px;
                width: 65%;
                font-size: 8px;
                min-height: 28px;
                padding: 4px 6px;
            }
            
            .touch-btn.search-btn {
                bottom: 195px;
                width: 65%;
                font-size: 8px;
                min-height: 28px;
                padding: 4px 6px;
            }
            
            .touch-btn.payment-btn {
                bottom: 235px;
                width: 65%;
                font-size: 8px;
                min-height: 28px;
                padding: 4px 6px;
            }
            
            #resultPopup { 
                font-size: 13px; 
                padding: 15px 20px; 
            }
            
            .name-title { font-size: 12px; }
            .name-input { font-size: 10px; padding: 10px; }
            .story-title { font-size: 11px; }
            .condition-title { font-size: 12px; }
        }

        @media (max-width: 360px) {
            .touch-btn.check-passport {
                bottom: 105px;
                width: 60%;
                font-size: 7px;
                min-height: 24px;
                padding: 3px 5px;
            }
            
            .touch-btn.breath-test {
                bottom: 140px;
                width: 60%;
                font-size: 7px;
                min-height: 24px;
                padding: 3px 5px;
            }
            
            .touch-btn.search-btn {

            }

                padding: 3px 5px;
            }
            
            .touch-btn.left, .touch-btn.right {
                font-size: 7px;
                min-height: 28px;
                padding: 3px 5px;
            }
            
            .panel-item { font-size: 6px; padding: 2px 3px; }
            .panel-item .value { font-size: 9px; }
            .guest-display { width: 110px; height: 316px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            #gameContainer { max-width: 70vh; }
            .guest-display { width: 100px; height: 287px; margin-top: 0; }
            .panel-item { font-size: 6px; padding: 2px 3px; }
            .panel-item .value { font-size: 9px; }
            .touch-btn { font-size: 6px; padding: 2px 4px; min-height: 22px; }
            .touch-btn.left, .touch-btn.right { font-size: 6px; min-height: 22px; }
            .touch-btn.check-passport { bottom: 100px; font-size: 6px; min-height: 20px; padding: 2px 4px; width: 60%; }
            .touch-btn.breath-test { bottom: 132px; font-size: 6px; min-height: 20px; padding: 2px 4px; width: 60%; }
            .touch-btn.search-btn { bottom: 164px; font-size: 6px; min-height: 20px; padding: 2px 4px; width: 60%; }

            #resultPopup { font-size: 10px; padding: 10px 14px; }
            .story-text { font-size: 8px; }
            .condition-text { font-size: 8px; }
            .condition-title { font-size: 11px; }
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <div class="guest-display" id="guestDisplay">
        <img id="guestImage" src="" alt="Гость">
    </div>

    <div id="resultPopup"></div>

    <button class="touch-btn left" id="btnLeft">◀ ОТПРАВИТЬ</button>
    <button class="touch-btn right" id="btnRight">ПРОПУСТИТЬ ▶</button>
    <button class="touch-btn check-passport" id="btnPassport">📋 ПАСПОРТ</button>
    <button class="touch-btn breath-test hidden" id="btnBreath">🌬️ ДЫХНУТЬ</button>
    <button class="touch-btn search-btn hidden" id="btnSearch">🔍 ОБЫСКАТЬ</button>
    <button class="touch-btn payment-btn hidden" id="btnPayment">💳 ОПЛАТА</button>
    <button class="touch-btn start-shift" id="btnStartShift">▶ НАЧАТЬ ИГРУ</button>

    <div id="nameModal">
        <div class="name-content">
            <div class="name-title">📝 ВВЕДИТЕ ИМЯ</div>
            <input class="name-input" id="nameInput" type="text" placeholder="ВАШЕ ИМЯ" maxlength="15">
            <button class="name-btn" id="nameConfirmBtn">▶ ДАЛЕЕ</button>
        </div>
    </div>

    <div id="storyModal">
        <div class="story-content">
            <div class="story-title" id="storyTitle">👋 ПРИВЕТСТВИЕ</div>
            <div class="story-text" id="storyText"></div>
            <button class="story-btn" id="storyConfirmBtn">▶ ДАЛЕЕ</button>
        </div>
    </div>

    <div id="conditionModal">
        <div class="condition-content">
            <div class="condition-title" id="conditionTitle">🌙 ПЕРВАЯ НОЧЬ</div>
            <div class="condition-text" id="conditionText"></div>
            <button class="condition-btn" id="conditionStartBtn">▶ НАЧАТЬ</button>
        </div>
    </div>

    <div id="waveCondition">НОЧЬ 1: СОВЕРШЕННОЛЕТНИЙ</div>
    
    <div id="topPanel">
        <div class="panel-item timer" id="timerDisplay">
            ⏱
            <span class="value" id="timerValue">45</span>
        </div>
        <div class="panel-item">
            👥
            <span class="value"><span id="guestCount">0</span>/10</span>
        </div>
        <div class="panel-item">
            ✕
            <span class="value"><span id="mistakeCount">0</span>/2</span>
        </div>
    </div>

    <div id="statusBar">⚡ НАЧНИ СМЕНУ</div>

    <div id="passportModal">
        <div class="passport-content">
            <div class="passport-title">📇 ПАСПОРТ РФ</div>
            <div class="passport-field">ИМЯ: <span id="pName">—</span></div>
            <div class="passport-field">ДАТА РОЖД.: <span id="pBirth">—</span></div>
            <div class="passport-field">ГРАЖДАНСТВО: <span>РФ</span></div>
            <button class="passport-close" id="passportClose">✕ ЗАКРЫТЬ</button>
        </div>
    </div>
</div>

<script>

                name: 'Вторая ночь', 
                checks: ['age', 'drunk'], 
                desc: 'СОВЕРШЕННОЛЕТНИЙ И НЕТ ПЬЯНЫХ*',
                tooltip: '*Для этого проверь паспорт и попроси дыхнуть'
            },
            { 
                id: 3, 
                name: 'Третья ночь', 
                checks: ['age', 'drunk', 'search'], 
                desc: 'СОВЕРШЕННОЛЕТНИЙ, ТРЕЗВЫЙ, БЕЗ ОРУЖИЯ*',
                tooltip: '*Для этого проверь паспорт, попроси дыхнуть и обыщи'
            },
            { 
                id: 4, 
                name: 'Четвёртая ночь', 
                checks: ['age', 'drunk', 'search', 'payment'], 
                desc: 'СОВЕРШЕННОЛЕТНИЙ, ТРЕЗВЫЙ, БЕЗ ОРУЖИЯ (ПАРНИ С ОПЛАТОЙ)*',
                tooltip: '*Для этого проверь паспорт, попроси дыхнуть, обыщи и проведи оплату'
            }
        ];

        let currentNightIndex = 0;
        let playerName = '';

        function generateGuest(index, nightIndex) {
            const isMale = index < 6;
            let name;
            if (isMale) {
                name = MALE_NAMES[index % MALE_NAMES.length];
            } else {
                name = FEMALE_NAMES[(index - 6) % FEMALE_NAMES.length];
            }
            const birthYear = 1990 + Math.floor(Math.random() * 25);
            const isAdult = birthYear <= 2008;
            const spriteKey = SPRITE_KEYS[index % SPRITE_KEYS.length];
            
            const isDrunk = Math.random() < 0.35;
            const hasWeapon = Math.random() < 0.25;
            const hasMoney = Math.random() < 0.6;
            
            return {
                id: index,
                name: name,
                birthYear: birthYear,
                isAdult: isAdult,
                spriteKey: spriteKey,
                imagePath: IMAGE_PATHS[spriteKey],
                isMale: isMale,
                isDrunk: isDrunk,
                hasWeapon: hasWeapon,
                hasMoney: hasMoney,
                checksDone: {
                    drunk: false,
                    search: false,
                    payment: false
                }
            };
        }

        const state = {
            shiftActive: false,
            gameOver: false,
            win: false,
            guests: [],
            currentGuestIndex: 0,
            checked: 0,
            mistakes: 0,
            maxGuests: 10,
            maxMistakes: 2,
            passportOpen: false,
            currentGuest: null,
            waitingForContinue: false,
            imagesLoaded: false,
            imageCache: {},
            timeLeft: WAVE_TIME_LIMIT,
            timerInterval: null,
            nightFailed: false,
            autoContinueTimeout: null,
            resultShown: false,
            resultTimeout: null,
            gameStarted: false,
            nameEntered: false,
            storyShown: false,
            waitingForNextNight: false
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const waveConditionEl = document.getElementById('waveCondition');
        const guestCountEl = document.getElementById('guestCount');
        const mistakeCountEl = document.getElementById('mistakeCount');
        const statusBar = document.getElementById('statusBar');
        const timerDisplay = document.getElementById('timerDisplay');
        const timerValue = document.getElementById('timerValue');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnPassport = document.getElementById('btnPassport');
        const btnBreath = document.getElementById('btnBreath');
        const btnSearch = document.getElementById('btnSearch');
        const btnPayment = document.getElementById('btnPayment');
        const btnStartShift = document.getElementById('btnStartShift');
        const nameModal = document.getElementById('nameModal');
        const nameInput = document.getElementById('nameInput');
        const nameConfirmBtn = document.getElementById('nameConfirmBtn');
        const storyModal = document.getElementById('storyModal');
        const storyTitle = document.getElementById('storyTitle');
        const storyText = document.getElementById('storyText');
        const storyConfirmBtn = document.getElementById('storyConfirmBtn');
        const conditionModal = document.getElementById('conditionModal');
        const conditionTitle = document.getElementById('conditionTitle');
        const conditionText = document.getElementById('conditionText');
        const conditionStartBtn = document.getElementById('conditionStartBtn');
        const passportModal = document.getElementById('passportModal');
        const passportClose = document.getElementById('passportClose');
        const pName = document.getElementById('pName');
        const pBirth = document.getElementById('pBirth');
        const guestImage = document.getElementById('guestImage');
        const guestDisplay = document.getElementById('guestDisplay');
        const resultPopup = document.getElementById('resultPopup');

        function hideResult() {
            resultPopup.style.display = 'none';
            state.resultShown = false;
            if (state.resultTimeout) {
                clearTimeout(state.resultTimeout);
                state.resultTimeout = null;
            }
        }

        function loadImages(callback) {
            const totalImages = Object.keys(IMAGE_PATHS).length;
            let loaded = 0;

            for (const [key, path] of Object.entries(IMAGE_PATHS)) {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    state.imageCache[key] = this;
                    loaded++;
                    if (loaded === totalImages) {
                        state.imagesLoaded = true;
                        if (callback) callback();
                    }
                };
                img.onerror = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 294;
                    canvas.height = 844;
                    const cctx = canvas.getContext('2d');
                    cctx.fillStyle = '#222';
                    cctx.fillRect(0, 0, 294, 844);
                    cctx.fillStyle = '#666';
                    cctx.font = 'bold 60px sans-serif';
                    cctx.textAlign = 'center';
                    cctx.textBaseline = 'middle';
                    cctx.fillText(key.toUpperCase(), 147, 422);
                    
                    const fallbackImg = new Image();
                    fallbackImg.src = canvas.toDataURL();
                    fallbackImg.onload = function() {
                        state.imageCache[key] = this;
                        loaded++;
                        if (loaded === totalImages) {
                            state.imagesLoaded = true;
                            if (callback) callback();
                        }
                    };
                };
                img.src = path;
            }
        }

        function startTimer() {
            clearInterval(state.timerInterval);
            state.timeLeft = WAVE_TIME_LIMIT;
            updateTimerDisplay();

            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                updateTimerDisplay();

                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                    if (state.shiftActive && !state.gameOver) {
                        nightFailed();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            timerValue.textContent = state.timeLeft;
            timerDisplay.classList.remove('warning', 'danger');
            if (state.timeLeft <= 5) {
                timerDisplay.classList.add('danger');
            } else if (state.timeLeft <= 10) {
                timerDisplay.classList.add('warning');
            }
        }

        function stopTimer() {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }

        function resetTimer() {
            stopTimer();
            state.timeLeft = WAVE_TIME_LIMIT;
            updateTimerDisplay();
        }

        function nightFailed() {
            if (state.gameOver) return;
            state.shiftActive = false;
            state.gameOver = true;
            state.win = false;
            state.nightFailed = true;
            
            statusBar.textContent = '⏰ ВРЕМЯ ВЫШЛО!';
            btnLeft.classList.add('hidden');
            btnRight.classList.add('hidden');
            btnPassport.classList.add('hidden');
            btnBreath.classList.add('hidden');
            btnSearch.classList.add('hidden');
            btnPayment.classList.add('hidden');
            btnStartShift.classList.remove('hidden');
            btnStartShift.textContent = '🔄 НАЧАТЬ ЗАНОВО';
            guestDisplay.style.display = 'none';
            stopTimer();
            hideResult();
            drawGame();
        }

        function showResult(text, type) {
            hideResult();
            resultPopup.textContent = text;
            resultPopup.className = type;
            resultPopup.style.display = 'block';
            state.resultShown = true;
            
            state.resultTimeout = setTimeout(() => {
                hideResult();
            }, 1800);
        }

        function showStartScreen() {
            btnStartShift.classList.remove('hidden');
            btnStartShift.textContent = '▶ НАЧАТЬ ИГРУ';
            btnLeft.classList.add('hidden');
            btnRight.classList.add('hidden');
            btnPassport.classList.add('hidden');
            btnBreath.classList.add('hidden');
            btnSearch.classList.add('hidden');
            btnPayment.classList.add('hidden');
            guestDisplay.style.display = 'none';
            nameModal.classList.remove('active');
            storyModal.classList.remove('active');
            conditionModal.classList.remove('active');
            waveConditionEl.textContent = 'ДОБРО ПОЖАЛОВАТЬ!';
            statusBar.textContent = '⚡ НАЧНИ ИГРУ';
            drawGame();
        }

        function showNameScreen() {
            nameModal.classList.add('active');
            nameInput.value = '';
            setTimeout(() => nameInput.focus(), 300);
        }

        function showStoryScreen() {
            nameModal.classList.remove('active');
            storyModal.classList.add('active');
            storyTitle.textContent = `👋 ПРИВЕТ, ${playerName}!`;
            storyText.textContent = `Ты новый фейсер клуба "Дом Культуры".\n\nТвоя задача — контролировать, кто проходит в клуб, а кому лучше отправиться домой.\n\nВпереди 4 ночи. Удачи!`;
        }

        function showNightCondition() {
            storyModal.classList.remove('active');
            const night = NIGHTS[currentNightIndex];
            conditionModal.classList.add('active');
            conditionTitle.textContent = `🌙 ${night.name}`;
            
            let condText = `УСЛОВИЕ ПРОХОДА:\n${night.desc}\n\n${night.tooltip}`;
            conditionText.textContent = condText;
        }

        function startNight() {
            if (!state.imagesLoaded) {
                statusBar.textContent = '⏳ ЗАГРУЗКА...';
                return;
            }

            const night = NIGHTS[currentNightIndex];
            
            state.shiftActive = true;
            state.gameOver = false;
            state.win = false;
            state.checked = 0;
            state.mistakes = 0;
            state.currentGuestIndex = 0;
            state.waitingForContinue = false;
            state.passportOpen = false;
            state.nightFailed = false;
            state.resultShown = false;
            state.waitingForNextNight = false;

            state.guests = [];
            for (let i = 0; i < 10; i++) {
                state.guests.push(generateGuest(i, currentNightIndex));
            }

            waveConditionEl.textContent = `НОЧЬ ${night.id}: ${night.desc.replace(/\*/g, '')}`;
            conditionModal.classList.remove('active');
            btnStartShift.classList.add('hidden');
            btnLeft.classList.remove('hidden');
            btnRight.classList.remove('hidden');
            btnPassport.classList.remove('hidden');
            
            btnBreath.classList.toggle('hidden', !night.checks.includes('drunk'));
            btnSearch.classList.toggle('hidden', !night.checks.includes('search'));
            btnPayment.classList.toggle('hidden', !night.checks.includes('payment'));

            resetTimer();
            startTimer();
            showGuest(0);
            updateUI();
            statusBar.textContent = '🔍 ПРОВЕРКА';
            hideResult();
        }

        function showGuest(index) {
            if (index >= state.guests.length) {
                // Ночь завершена - показываем следующую
                if (currentNightIndex < NIGHTS.length - 1) {
                    currentNightIndex++;
                    state.shiftActive = false;
                    state.gameOver = false;
                    state.win = false;
                    state.waitingForNextNight = true;
                    statusBar.textContent = `🌙 НОЧЬ ${currentNightIndex + 1}`;
                    btnLeft.classList.add('hidden');
                    btnRight.classList.add('hidden');
                    btnPassport.classList.add('hidden');
                    btnBreath.classList.add('hidden');
                    btnSearch.classList.add('hidden');
                    btnPayment.classList.add('hidden');
                    guestDisplay.style.display = 'none';
                    stopTimer();
                    hideResult();
                    drawGame();
                    
                    // Автоматически показываем условие следующей ночи через 1.5 секунды
                    setTimeout(() => {
                        if (state.waitingForNextNight) {
                            showNightCondition();
                            state.waitingForNextNight = false;
                        }
                    }, 1500);
                    return;
                } else {
                    // Все ночи пройдены - победа!
                    state.shiftActive = false;
                    state.gameOver = true;
                    state.win = true;
                    statusBar.textContent = '🏆 ПОБЕДА! ВСЕ НОЧИ ПРОЙДЕНЫ!';
                    btnLeft.classList.add('hidden');
                    btnRight.classList.add('hidden');
                    btnPassport.classList.add('hidden');
                    btnBreath.classList.add('hidden');
                    btnSearch.classList.add('hidden');
                    btnPayment.classList.add('hidden');
                    btnStartShift.classList.remove('hidden');
                    btnStartShift.textContent = '🔄 ИГРАТЬ СНОВА';
                    guestDisplay.style.display = 'none';
                    stopTimer();
                    hideResult();
                    drawGame();
                    return;
                }
            }

            state.currentGuest = state.guests[index];
            state.currentGuestIndex = index;
            state.passportOpen = false;
            passportModal.classList.remove('active');
            state.resultShown = false;
            hideResult();

            const guest = state.currentGuest;
            guest.checksDone = { drunk: false, search: false, payment: false };

            const img = state.imageCache[guest.spriteKey];
            if (img) {
                guestImage.src = img.src;
                guestDisplay.style.display = 'flex';
            }

            drawGame();
        }

        function handleCheck(type) {
            if (!state.shiftActive || state.gameOver) return;
            if (state.waitingForContinue) return;
            if (!state.currentGuest) return;
            
            hideResult();

            const guest = state.currentGuest;
            
            if (type === 'drunk') {
                guest.checksDone.drunk = true;
                if (guest.isDrunk) {
                    showResult('🍺 ЗАПАХ АЛКОГОЛЯ', 'danger');
                } else {
                    showResult('✅ ВСЁ ХОРОШО', 'success');
                }
            } else if (type === 'search') {
                guest.checksDone.search = true;
                if (guest.hasWeapon) {
                    showResult('🔫 НАЙДЕНО ОРУЖИЕ!', 'danger');
                } else {
                    showResult('✅ НИЧЕГО НЕ НАЙДЕНО', 'success');
                }
            } else if (type === 'payment') {
                guest.checksDone.payment = true;
                if (!guest.isMale) {
                    showResult('⚠️ ТОЛЬКО ДЛЯ ПАРНЕЙ', 'info');
                    guest.checksDone.payment = false;
                    return;
                }
                if (guest.hasMoney) {
                    showResult('💳 ОПЛАТА ПРОШЛА', 'success');
                } else {
                    showResult('💸 НЕТ ДЕНЕГ', 'danger');
                }
            }
        }

        function handleDecision(allow) {
            if (!state.shiftActive || state.gameOver) return;
            if (state.waitingForContinue) return;
            if (!state.currentGuest) return;
            
            hideResult();

            const guest = state.currentGuest;
            const night = NIGHTS[currentNightIndex];
            let isMistake = false;

            let shouldPass = true;
            
            if (night.checks.includes('age') && !guest.isAdult) {
                shouldPass = false;
            }
            
            if (night.checks.includes('drunk') && guest.checksDone.drunk && guest.isDrunk) {
                shouldPass = false;
            }
            if (night.checks.includes('search') && guest.checksDone.search && guest.hasWeapon) {
                shouldPass = false;
            }
            if (night.checks.includes('payment') && guest.checksDone.payment && (!guest.isMale || !guest.hasMoney)) {
                shouldPass = false;
            }

            isMistake = (allow && !shouldPass) || (!allow && shouldPass);

            if (isMistake) {
                state.mistakes++;
            }

            state.checked++;
            updateUI();

            if (state.mistakes >= state.maxMistakes) {
                state.shiftActive = false;
                state.gameOver = true;
                state.win = false;
                statusBar.textContent = '💀 ПОРАЖЕНИЕ!';
                btnLeft.classList.add('hidden');
                btnRight.classList.add('hidden');
                btnPassport.classList.add('hidden');
                btnBreath.classList.add('hidden');
                btnSearch.classList.add('hidden');
                btnPayment.classList.add('hidden');
                btnStartShift.classList.remove('hidden');
                btnStartShift.textContent = '🔄 НАЧАТЬ ЗАНОВО';
                guestDisplay.style.display = 'none';
                stopTimer();
                hideResult();
                drawGame();
                return;
            }

            const action = allow ? 'ПРОПУЩЕН' : 'ОТПРАВЛЕН';
            const status = isMistake ? '⚠️ ОШИБКА' : '✅ ВЕРНО';
            statusBar.textContent = `${status} ${action}`;
            
            state.waitingForContinue = true;
            btnLeft.classList.add('hidden');
            btnRight.classList.add('hidden');
            btnPassport.classList.add('hidden');
            btnBreath.classList.add('hidden');
            btnSearch.classList.add('hidden');
            btnPayment.classList.add('hidden');
            drawGame();

            clearTimeout(state.autoContinueTimeout);
            state.autoContinueTimeout = setTimeout(() => {
                if (state.waitingForContinue && state.shiftActive && !state.gameOver) {
                    state.waitingForContinue = false;
                    btnLeft.classList.remove('hidden');
                    btnRight.classList.remove('hidden');
                    btnPassport.classList.remove('hidden');
                    
                    const night = NIGHTS[currentNightIndex];
                    btnBreath.classList.toggle('hidden', !night.checks.includes('drunk'));
                    btnSearch.classList.toggle('hidden', !night.checks.includes('search'));
                    btnPayment.classList.toggle('hidden', !night.checks.includes('payment'));
                    
                    showGuest(state.currentGuestIndex + 1);
                    updateUI();
                    drawGame();
                }
            }, AUTO_CONTINUE_DELAY);
        }

        function openPassport() {
            if (!state.currentGuest || state.gameOver) return;
            if (state.passportOpen) {
                passportModal.classList.remove('active');
                state.passportOpen = false;
                return;
            }
            hideResult();
            const guest = state.currentGuest;
            pName.textContent = guest.name;
            pBirth.textContent = guest.birthYear;
            passportModal.classList.add('active');
            state.passportOpen = true;
        }

        function closePassport() {
            passportModal.classList.remove('active');
            state.passportOpen = false;
        }

        function updateUI() {
            guestCountEl.textContent = state.checked;
            mistakeCountEl.textContent = state.mistakes;
        }

        function drawGame() {
            ctx.clearRect(0, 0, 360, 640);

            const fonImg = state.imageCache['fon'];
            if (fonImg && fonImg.complete && fonImg.naturalWidth > 0) {
                ctx.drawImage(fonImg, 0, 0, 360, 640);
            } else {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, 360, 640);
                for (let y = 0; y < 640; y += 16) {
                    for (let x = 0; x < 360; x += 16) {
                        if ((x + y) % 32 === 0) {
                            ctx.fillStyle = '#111';
                            ctx.fillRect(x, y, 8, 8);
                        }
                    }
                }
            }

            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(0, 0, 360, 640);

            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 600, 360, 40);
            ctx.fillStyle = '#222';
            ctx.fillRect(10, 608, 340, 24);

            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillStyle = '#555';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let statusText = 'ОЖИДАНИЕ';
            if (state.gameOver) {
                if (state.win) statusText = 'ПОБЕДА!';
                else if (state.nightFailed) statusText = 'ВРЕМЯ ВЫШЛО!';
                else statusText = 'ПОРАЖЕНИЕ!';
            } else if (state.shiftActive) {
                statusText = `НОЧЬ ${currentNightIndex + 1}/${NIGHTS.length}`;
            } else if (state.waitingForNextNight) {
                statusText = 'ЗАГРУЗКА...';
            }
            ctx.fillText(statusText, 180, 620);
        }

        // === ОБРАБОТЧИКИ ===

        btnStartShift.addEventListener('click', () => {
            if (state.gameOver && state.win) {
                currentNightIndex = 0;
                state.win = false;
                state.gameOver = false;
                showStartScreen();
                setTimeout(() => showNameScreen(), 300);
                return;
            }
            if (state.gameOver && !state.win) {
                currentNightIndex = 0;
                state.win = false;
                state.gameOver = false;
                showStartScreen();
                setTimeout(() => showNameScreen(), 300);
                return;
            }
            showNameScreen();
        });
        btnStartShift.addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            if (state.gameOver && state.win) {
                currentNightIndex = 0;
                state.win = false;
                state.gameOver = false;
                showStartScreen();
                setTimeout(() => showNameScreen(), 300);
                return;
            }
            if (state.gameOver && !state.win) {
                currentNightIndex = 0;
                state.win = false;
                state.gameOver = false;
                showStartScreen();
                setTimeout(() => showNameScreen(), 300);
                return;
            }
            showNameScreen();
        });

        nameConfirmBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (name.length === 0) {
                nameInput.style.borderColor = '#ff4444';
                setTimeout(() => nameInput.style.borderColor = '#444', 500);
                return;
            }
            playerName = name;
            state.nameEntered = true;
            showStoryScreen();
        });
        nameConfirmBtn.addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            const name = nameInput.value.trim();
            if (name.length === 0) {
                nameInput.style.borderColor = '#ff4444';
                setTimeout(() => nameInput.style.borderColor = '#444', 500);
                return;
            }
            playerName = name;
            state.nameEntered = true;
            showStoryScreen();
        });

        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const name = nameInput.value.trim();
                if (name.length === 0) {
                    nameInput.style.borderColor = '#ff4444';
                    setTimeout(() => nameInput.style.borderColor = '#444', 500);
                    return;
                }
                playerName = name;
                state.nameEntered = true;
                showStoryScreen();
            }
        });

        storyConfirmBtn.addEventListener('click', () => {
            showNightCondition();
        });
        storyConfirmBtn.addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            showNightCondition();
        });

        conditionStartBtn.addEventListener('click', startNight);
        conditionStartBtn.addEventListener('touchend', (e) => { e.preventDefault(); startNight(); });

        btnLeft.addEventListener('click', () => handleDecision(false));
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); handleDecision(false); });

        btnRight.addEventListener('click', () => handleDecision(true));
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); handleDecision(true); });

        btnPassport.addEventListener('click', openPassport);
        btnPassport.addEventListener('touchend', (e) => { e.preventDefault(); openPassport(); });

        btnBreath.addEventListener('click', () => handleCheck('drunk'));
        btnBreath.addEventListener('touchend', (e) => { e.preventDefault(); handleCheck('drunk'); });

        btnSearch.addEventListener('click', () => handleCheck('search'));
        btnSearch.addEventListener('touchend', (e) => { e.preventDefault(); handleCheck('search'); });

        btnPayment.addEventListener('click', () => handleCheck('payment'));
        btnPayment.addEventListener('touchend', (e) => { e.preventDefault(); handleCheck('payment'); });

        passportClose.addEventListener('click', closePassport);
        passportClose.addEventListener('touchend', (e) => { e.preventDefault(); closePassport(); });

        passportModal.addEventListener('click', (e) => {
            if (e.target === passportModal) closePassport();
        });

        function init() {
            statusBar.textContent = '⏳ ЗАГРУЗКА...';
            currentNightIndex = 0;
            
            loadImages(function() {
                showStartScreen();
                drawGame();
            });
        }

        init();
        window.addEventListener('resize', drawGame);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (nameModal.classList.contains('active')) {
                    const name = nameInput.value.trim();
                    if (name.length === 0) {
                        nameInput.style.borderColor = '#ff4444';
                        setTimeout(() => nameInput.style.borderColor = '#444', 500);
                        return;
                    }
                    playerName = name;
                    state.nameEntered = true;
                    showStoryScreen();
                } else if (storyModal.classList.contains('active')) {
                    showNightCondition();
                } else if (conditionModal.classList.contains('active')) {
                    startNight();
                }
            }
            if (e.key === 'p' || e.key === 'P') {
                if (!btnPassport.classList.contains('hidden')) openPassport();
            }
            if (e.key === 'b' || e.key === 'B') {
                if (!btnBreath.classList.contains('hidden')) handleCheck('drunk');
            }
            if (e.key === 's' || e.key === 'S') {
                if (!btnSearch.classList.contains('hidden')) handleCheck('search');
            }
            if (e.key === 'm' || e.key === 'M') {
                if (!btnPayment.classList.contains('hidden')) handleCheck('payment');
            }
            if (e.key === 'ArrowLeft') {
                if (!btnLeft.classList.contains('hidden')) handleDecision(false);
            }
            if (e.key === 'ArrowRight') {
                if (!btnRight.classList.contains('hidden')) handleDecision(true);
            }
            if (e.key === 'Escape') {
                if (state.passportOpen) closePassport();
            }
        });
    })();
</script>
</body>
</html>
