<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>16-бит Охранник клуба</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
            touch-action: manipulation;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 9 / 16;
            background: #000;
            overflow: hidden;
            border: 3px solid #333;
            box-shadow: 0 0 40px rgba(255,255,255,0.05);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            background: #000;
            touch-action: none;
        }

        .touch-btn {
            position: absolute;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #fff;
            background: rgba(0,0,0,0.85);
            border: 3px solid #444;
            padding: 6px 10px;
            cursor: pointer;
            touch-action: manipulation;
            text-shadow: 1px 1px 0 #000;
            box-shadow: 0 4px 0 #222;
            transition: 0.05s linear;
            border-radius: 0;
            letter-spacing: 0.5px;
            z-index: 10;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
            backdrop-filter: blur(2px);
        }

        .touch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #222;
        }

        .touch-btn.left {
            left: 8px;
            bottom: 70px;
            width: calc(50% - 16px);
            border-color: #555;
            font-size: 9px;
        }

        .touch-btn.right {
            right: 8px;
            bottom: 70px;
            width: calc(50% - 16px);
            border-color: #555;
            font-size: 9px;
        }

        .touch-btn.check-passport {
            left: 50%;
            transform: translateX(-50%);
            bottom: 130px;
            width: 70%;
            border-color: #666;
            font-size: 9px;
            min-height: 36px;
        }

        .touch-btn.check-passport:active {
            transform: translateX(-50%) translateY(3px);
        }

        .touch-btn.start-shift {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            padding: 18px;
            font-size: 16px;
            border-color: #666;
            z-index: 20;
            background: rgba(0,0,0,0.9);
        }

        .touch-btn.start-shift:active {
            transform: translate(-50%, -50%) translateY(3px);
        }

        .touch-btn.continue-btn {
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            width: 60%;
            border-color: #555;
            font-size: 11px;
            min-height: 36px;
        }

        .touch-btn.hidden {
            display: none !important;
        }

        #passportModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #passportModal.active {
            display: flex;
        }

        .passport-content {
            background: #0a0a0a;
            border: 4px solid #444;
            padding: 25px 20px 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        .passport-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #888;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .passport-photo {
            width: 80px;
            height: 80px;
            background: #1a1a1a;
            border: 3px solid #444;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            image-rendering: pixelated;
        }

        .passport-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        .passport-field {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #888;
            margin: 8px 0;
            text-align: left;
            padding-left: 8px;
            border-left: 2px solid #333;
        }

        .passport-field span {
            color: #fff;
            font-size: 11px;
        }

        .passport-close {
            margin-top: 16px;
            padding: 10px 20px;
            background: #111;
            border: 3px solid #555;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            touch-action: manipulation;
            width: 100%;
        }

        .passport-close:active {
            background: #222;
        }

        #waveCondition {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #888;
            background: rgba(0,0,0,0.85);
            padding: 6px 12px;
            border: 2px solid #333;
            z-index: 5;
            text-align: center;
            width: 92%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(2px);
        }

        #statusBar {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #555;
            background: rgba(0,0,0,0.8);
            padding: 4px 12px;
            border: 2px solid #222;
            z-index: 5;
            text-align: center;
            width: 92%;
        }

        #counters {
            position: absolute;
            top: 50px;
            right: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #555;
            text-align: right;
            z-index: 5;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border: 2px solid #222;
            line-height: 1.8;
            backdrop-filter: blur(2px);
        }

        #counters span {
            color: #aaa;
        }

        .guest-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 180px;
            height: 516px;
            display: none;
            align-items: center;
            justify-content: center;
            margin-top: -20px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .guest-display img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.03));
        }

        .guest-name {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #aaa;
            z-index: 4;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border: 2px solid #333;
            white-space: nowrap;
            display: none;
        }

        .guest-year {
            position: absolute;
            bottom: 175px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #666;
            z-index: 4;
            background: rgba(0,0,0,0.7);
            padding: 2px 10px;
            border: 2px solid #222;
            display: none;
        }

        @media (max-width: 400px) {
            .touch-btn { font-size: 8px; padding: 4px 6px; min-height: 34px; }
            .touch-btn.start-shift { font-size: 12px; padding: 14px; }
            .passport-field { font-size: 8px; }
            .passport-field span { font-size: 9px; }
            #waveCondition { font-size: 7px; }
            #counters { font-size: 7px; }
            .guest-display { width: 130px; height: 373px; }
            .guest-name { font-size: 8px; bottom: 160px; }
            .guest-year { font-size: 7px; bottom: 140px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            #gameContainer { max-width: 70vh; }
            .guest-display { width: 100px; height: 287px; margin-top: 0; }
            .guest-name { bottom: 120px; font-size: 7px; }
            .guest-year { bottom: 105px; font-size: 6px; }
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <!-- Отображение гостя с разрешением 294x844 -->
    <div class="guest-display" id="guestDisplay">
        <img id="guestImage" src="" alt="Гость">
    </div>
    <div class="guest-name" id="guestNameDisplay">—</div>
    <div class="guest-year" id="guestYearDisplay">Г.Р. —</div>

    <button class="touch-btn left" id="btnLeft">◀ ОТПРАВИТЬ</button>
    <button class="touch-btn right" id="btnRight">ПРОПУСТИТЬ ▶</button>
    <button class="touch-btn check-passport" id="btnPassport">📋 ПАСПОРТ</button>
    <button class="touch-btn start-shift" id="btnStartShift">▶ НАЧАТЬ СМЕНУ</button>
    <button class="touch-btn continue-btn hidden" id="btnContinue">▶ ДАЛЕЕ</button>

    <div id="waveCondition">УСЛОВИЕ: ВСЕ СОВЕРШЕННОЛЕТНИЕ</div>
    <div id="counters">👥 <span id="guestCount">0</span>/10<br>✕ <span id="mistakeCount">0</span>/2</div>
    <div id="statusBar">⚡ НАЧНИ СМЕНУ</div>

    <div id="passportModal">
        <div class="passport-content">
            <div class="passport-title">📇 ПАСПОРТ РФ</div>
            <div class="passport-photo" id="passportPhoto">
                <img id="passportImage" src="" alt="Фото">
            </div>
            <div class="passport-field">ИМЯ: <span id="pName">—</span></div>
            <div class="passport-field">ДАТА РОЖД.: <span id="pBirth">—</span></div>
            <div class="passport-field">ГРАЖДАНСТВО: <span>РФ</span></div>
            <button class="passport-close" id="passportClose">✕ ЗАКРЫТЬ</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // === ПУТИ К ИЗОБРАЖЕНИЯМ ===
        const IMAGE_PATHS = {
            fon: 'ph/fon.png',
            a1: 'ph/a1.png',
            a2: 'ph/a2.png',
            a3: 'ph/a3.png',
            a4: 'ph/a4.png',
            a5: 'ph/a5.png',
            a6: 'ph/a6.png',
            a7: 'ph/a7.png',
            a8: 'ph/a8.png',
            a9: 'ph/a9.png',
            a10: 'ph/a10.png',
            a11: 'ph/a11.png',
            a12: 'ph/a12.png',
            a13: 'ph/a13.png',
            a14: 'ph/a14.png'
        };

        const SPRITE_KEYS = ['a1','a2','a3','a4','a5','a6','a7','a8','a9','a10','a11','a12','a13','a14'];

        // === ИМЕНА ===
        const NAMES = [
            'АЛЕКСЕЙ ИВАНОВ', 'МАРИЯ ПЕТРОВА', 'ДМИТРИЙ СМИРНОВ', 'АННА КУЗНЕЦОВА',
            'СЕРГЕЙ ПОПОВ', 'ЕКАТЕРИНА СОКОЛОВА', 'АНДРЕЙ ЛЕБЕДЕВ', 'ОЛЬГА КОЗЛОВА',
            'ИВАН МОРОЗОВ', 'ТАТЬЯНА НОВИКОВА', 'ПАВЕЛ ВОЛКОВ', 'ЮЛИЯ МЕДВЕДЕВА',
            'НИКОЛАЙ ЕГОРОВ', 'АЛЕНА ТИХОНОВА'
        ];

        function generateGuest(index) {
            const name = NAMES[index % NAMES.length];
            const birthYear = 1990 + Math.floor(Math.random() * 25);
            const isAdult = birthYear <= 2008;
            const spriteKey = SPRITE_KEYS[index % SPRITE_KEYS.length];
            return {
                id: index,
                name: name,
                birthYear: birthYear,
                isAdult: isAdult,
                spriteKey: spriteKey,
                imagePath: IMAGE_PATHS[spriteKey]
            };
        }

        // === СОСТОЯНИЕ ===
        const state = {
            shiftActive: false,
            gameOver: false,
            win: false,
            guests: [],
            currentGuestIndex: 0,
            checked: 0,
            mistakes: 0,
            maxGuests: 10,
            maxMistakes: 2,
            passportOpen: false,
            currentGuest: null,
            waitingForContinue: false,
            imagesLoaded: false,
            imageCache: {}
        };

        // === DOM ===
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const waveConditionEl = document.getElementById('waveCondition');
        const guestCountEl = document.getElementById('guestCount');
        const mistakeCountEl = document.getElementById('mistakeCount');
        const statusBar = document.getElementById('statusBar');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnPassport = document.getElementById('btnPassport');
        const btnStartShift = document.getElementById('btnStartShift');
        const btnContinue = document.getElementById('btnContinue');
        const passportModal = document.getElementById('passportModal');
        const passportClose = document.getElementById('passportClose');
        const pName = document.getElementById('pName');
        const pBirth = document.getElementById('pBirth');
        const passportImage = document.getElementById('passportImage');
        const guestImage = document.getElementById('guestImage');
        const guestNameDisplay = document.getElementById('guestNameDisplay');
        const guestYearDisplay = document.getElementById('guestYearDisplay');
        const guestDisplay = document.getElementById('guestDisplay');

        // === ЗАГРУЗКА ИЗОБРАЖЕНИЙ ===
        function loadImages(callback) {
            const totalImages = Object.keys(IMAGE_PATHS).length;
            let loaded = 0;

            for (const [key, path] of Object.entries(IMAGE_PATHS)) {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    state.imageCache[key] = this;
                    loaded++;
                    console.log(`✅ Загружено: ${key} (${loaded}/${totalImages})`);
                    if (loaded === totalImages) {
                        state.imagesLoaded = true;
                        if (callback) callback();
                    }
                };
                img.onerror = function() {
                    console.warn(`⚠️ Не удалось загрузить: ${path}`);
                    // Создаём заглушку с размерами 294x844
                    const canvas = document.createElement('canvas');
                    canvas.width = 294;
                    canvas.height = 844;
                    const cctx = canvas.getContext('2d');
                    cctx.fillStyle = '#222';
                    cctx.fillRect(0, 0, 294, 844);
                    cctx.fillStyle = '#666';
                    cctx.font = 'bold 60px sans-serif';
                    cctx.textAlign = 'center';
                    cctx.textBaseline = 'middle';
                    cctx.fillText(key.toUpperCase(), 147, 422);
                    cctx.strokeStyle = '#444';
                    cctx.lineWidth = 3;
                    cctx.strokeRect(3, 3, 288, 838);
                    
                    const fallbackImg = new Image();
                    fallbackImg.src = canvas.toDataURL();
                    fallbackImg.onload = function() {
                        state.imageCache[key] = this;
                        loaded++;
                        console.log(`⚠️ Заглушка для: ${key} (${loaded}/${totalImages})`);
                        if (loaded === totalImages) {
                            state.imagesLoaded = true;
                            if (callback) callback();
                        }
                    };
                };
                img.src = path;
            }
        }

        // === ФУНКЦИИ ===
        function startShift() {
            if (!state.imagesLoaded) {
                statusBar.textContent = '⏳ ЗАГРУЗКА ИЗОБРАЖЕНИЙ...';
                return;
            }

            state.shiftActive = true;
            state.gameOver = false;
            state.win = false;
            state.checked = 0;
            state.mistakes = 0;
            state.currentGuestIndex = 0;
            state.waitingForContinue = false;
            state.passportOpen = false;

            state.guests = [];
            for (let i = 0; i < 10; i++) {
                state.guests.push(generateGuest(i));
            }

            waveConditionEl.textContent = 'УСЛОВИЕ: ВСЕ СОВЕРШЕННОЛЕТНИЕ';
            btnStartShift.classList.add('hidden');
            btnContinue.classList.add('hidden');
            btnLeft.classList.remove('hidden');
            btnRight.classList.remove('hidden');
            btnPassport.classList.remove('hidden');

            showGuest(0);
            updateUI();
            statusBar.textContent = '🔍 ПРОВЕРКА';
        }

        function showGuest(index) {
            if (index >= state.guests.length) {
                state.shiftActive = false;
                state.gameOver = true;
                state.win = true;
                statusBar.textContent = '🏆 ПОБЕДА!';
                btnLeft.classList.add('hidden');
                btnRight.classList.add('hidden');
                btnPassport.classList.add('hidden');
                btnContinue.classList.add('hidden');
                btnStartShift.classList.remove('hidden');
                btnStartShift.textContent = '🔄 НОВАЯ СМЕНА';
                guestDisplay.style.display = 'none';
                guestNameDisplay.style.display = 'none';
                guestYearDisplay.style.display = 'none';
                drawGame();
                return;
            }

            state.currentGuest = state.guests[index];
            state.currentGuestIndex = index;
            state.passportOpen = false;
            passportModal.classList.remove('active');

            // Отображаем гостя с разрешением 294x844
            const guest = state.currentGuest;
            const img = state.imageCache[guest.spriteKey];
            if (img) {
                guestImage.src = img.src;
                guestDisplay.style.display = 'flex';
            }
            guestNameDisplay.textContent = guest.name;
            guestNameDisplay.style.display = 'block';
            guestYearDisplay.textContent = `Г.Р. ${guest.birthYear}`;
            guestYearDisplay.style.display = 'block';

            drawGame();
        }

        function handleDecision(allow) {
            if (!state.shiftActive || state.gameOver) return;
            if (state.waitingForContinue) return;
            if (!state.currentGuest) return;

            const guest = state.currentGuest;
            if (allow && !guest.isAdult) {
                state.mistakes++;
            }

            state.checked++;
            updateUI();

            if (state.mistakes >= state.maxMistakes) {
                state.shiftActive = false;
                state.gameOver = true;
                state.win = false;
                statusBar.textContent = '💀 ПОРАЖЕНИЕ!';
                btnLeft.classList.add('hidden');
                btnRight.classList.add('hidden');
                btnPassport.classList.add('hidden');
                btnStartShift.classList.remove('hidden');
                btnStartShift.textContent = '🔄 НАЧАТЬ СНОВА';
                guestDisplay.style.display = 'none';
                guestNameDisplay.style.display = 'none';
                guestYearDisplay.style.display = 'none';
                drawGame();
                return;
            }

            state.waitingForContinue = true;
            btnContinue.classList.remove('hidden');
            statusBar.textContent = `✅ ${guest.name.split(' ')[0]} ${allow ? 'ПРОПУЩЕН' : 'ОТПРАВЛЕН'}`;
            drawGame();
        }

        function nextGuest() {
            state.waitingForContinue = false;
            btnContinue.classList.add('hidden');
            showGuest(state.currentGuestIndex + 1);
            updateUI();
            drawGame();
        }

        function openPassport() {
            if (!state.currentGuest || state.gameOver) return;
            if (state.passportOpen) {
                passportModal.classList.remove('active');
                state.passportOpen = false;
                return;
            }
            const guest = state.currentGuest;
            pName.textContent = guest.name;
            pBirth.textContent = guest.birthYear;
            const img = state.imageCache[guest.spriteKey];
            if (img) {
                passportImage.src = img.src;
            }
            passportModal.classList.add('active');
            state.passportOpen = true;
        }

        function closePassport() {
            passportModal.classList.remove('active');
            state.passportOpen = false;
        }

        function updateUI() {
            guestCountEl.textContent = state.checked;
            mistakeCountEl.textContent = state.mistakes;
        }

        // === ОТРИСОВКА ФОНА ===
        function drawGame() {
            ctx.clearRect(0, 0, 360, 640);

            // Рисуем фон
            const fonImg = state.imageCache['fon'];
            if (fonImg && fonImg.complete && fonImg.naturalWidth > 0) {
                ctx.drawImage(fonImg, 0, 0, 360, 640);
            } else {
                // Запасной фон
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, 360, 640);
                for (let y = 0; y < 640; y += 16) {
                    for (let x = 0; x < 360; x += 16) {
                        if ((x + y) % 32 === 0) {
                            ctx.fillStyle = '#111';
                            ctx.fillRect(x, y, 8, 8);
                        }
                    }
                }
            }

            // Затемнение для читаемости
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(0, 0, 360, 640);

            // Статус внизу
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 600, 360, 40);
            ctx.fillStyle = '#222';
            ctx.fillRect(10, 608, 340, 24);

            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillStyle = '#555';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const statusText = state.gameOver ? (state.win ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ') :
                              state.shiftActive ? 'ИДЁТ СМЕНА' : 'ОЖИДАНИЕ';
            ctx.fillText(statusText, 180, 620);
        }

        // === ОБРАБОТЧИКИ ===
        btnStartShift.addEventListener('click', startShift);
        btnStartShift.addEventListener('touchend', (e) => { e.preventDefault(); startShift(); });

        btnLeft.addEventListener('click', () => handleDecision(false));
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); handleDecision(false); });

        btnRight.addEventListener('click', () => handleDecision(true));
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); handleDecision(true); });

        btnPassport.addEventListener('click', openPassport);
        btnPassport.addEventListener('touchend', (e) => { e.preventDefault(); openPassport(); });

        btnContinue.addEventListener('click', nextGuest);
        btnContinue.addEventListener('touchend', (e) => { e.preventDefault(); nextGuest(); });

        passportClose.addEventListener('click', closePassport);
        passportClose.addEventListener('touchend', (e) => { e.preventDefault(); closePassport(); });

        passportModal.addEventListener('click', (e) => {
            if (e.target === passportModal) closePassport();
        });

        // === ИНИЦИАЛИЗАЦИЯ ===
        function init() {
            statusBar.textContent = '⏳ ЗАГРУЗКА...';
            
            loadImages(function() {
                console.log('🎮 Все изображения загружены!');
                btnStartShift.classList.remove('hidden');
                btnLeft.classList.add('hidden');
                btnRight.classList.add('hidden');
                btnPassport.classList.add('hidden');
                btnContinue.classList.add('hidden');
                guestDisplay.style.display = 'none';
                guestNameDisplay.style.display = 'none';
                guestYearDisplay.style.display = 'none';
                statusBar.textContent = '⚡ НАЧНИ СМЕНУ';
                waveConditionEl.textContent = 'УСЛОВИЕ: ВСЕ СОВЕРШЕННОЛЕТНИЕ';
                guestCountEl.textContent = '0';
                mistakeCountEl.textContent = '0';
                drawGame();
            });
        }

        init();
        window.addEventListener('resize', drawGame);

        // Клавиатура
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !btnStartShift.classList.contains('hidden')) startShift();
            if (e.key === 'p' || e.key === 'P') {
                if (!btnPassport.classList.contains('hidden')) openPassport();
            }
            if (e.key === 'ArrowLeft') {
                if (!btnLeft.classList.contains('hidden')) handleDecision(false);
            }
            if (e.key === 'ArrowRight') {
                if (!btnRight.classList.contains('hidden')) handleDecision(true);
            }
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (!btnContinue.classList.contains('hidden')) nextGuest();
            }
            if (e.key === 'Escape') {
                if (state.passportOpen) closePassport();
            }
        });
    })();
</script>
</body>
</html>
